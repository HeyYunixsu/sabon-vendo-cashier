<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Sabon Vendo</title>
<style>
/* ===================================================================
   Sabon Vendo — Cashier Dashboard
   Token naming: bg-surface-primary, text-content-secondary, etc.
   Breakpoints: 1440px desktop / 768px tablet / 375px mobile
   =================================================================== */

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&family=Doto:wght@700&display=swap');

:root {
  --bg-surface-primary:   #0B0E14;
  --bg-surface-secondary: #141925;
  --bg-surface-tertiary:  #1C2333;
  --border-default:       #232A3B;
  --border-strong:        #3B6DF0;
  --text-content-primary: #F5F7FA;
  --text-content-secondary: #8A93A6;
  --text-content-inverse: #0B0E14;
  --accent-action:        #3B6DF0;
  --accent-action-hover:  #507DF4;
  --status-positive:      #34D399;
  --status-caution:       #FBBF24;
  --status-negative:      #F87171;
  --status-neutral:       #4B5263;
  --radius-container:     14px;
  --radius-element:       8px;
  --radius-pill:          999px;
  --space-unit: 8px;
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 14px;
  color: var(--text-content-primary);
  background: var(--bg-surface-primary);
}
[data-theme="light"] {
  --bg-surface-primary:   #F3F4F6;
  --bg-surface-secondary: #FFFFFF;
  --bg-surface-tertiary:  #F0F1F3;
  --border-default:       #D1D5DB;
  --border-strong:        #3B6DF0;
  --text-content-primary: #1A1A1A;
  --text-content-secondary: #6B7280;
  --text-content-inverse: #FFFFFF;
  --status-positive:      #16A34A;
  --status-caution:       #D97706;
  --status-negative:      #DC2626;
  --status-neutral:       #9CA3AF;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  max-width: 1280px; margin: 0 auto; min-height: 100vh;
  padding: 20px; display: flex; flex-direction: column;
}

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-default); border-radius: 3px; }

/* ===================================================================
   HEADER
   =================================================================== */
#status-bar {
  display: flex; justify-content: space-between; align-items: center;
  background: var(--bg-surface-secondary);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-container);
  padding: 12px 24px; margin-bottom: 20px; flex-shrink: 0;
  font-family: 'IBM Plex Mono', monospace; font-size: 12px;
  color: var(--text-content-secondary);
}
.status-left, .status-center, .status-right {
  display: flex; align-items: center; gap: 20px;
}

/* Status dot (8px) */
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; flex-shrink: 0; }
.dot-positive { background: var(--status-positive); box-shadow: 0 0 6px rgba(52,211,153,.35); }
.dot-negative { background: var(--status-negative); box-shadow: 0 0 6px rgba(248,113,113,.35); }
.dot-accent  { background: var(--accent-action);  box-shadow: 0 0 8px rgba(59,109,240,.4); }
.dot-caution { background: var(--status-caution); box-shadow: 0 0 8px rgba(251,191,36,.4); animation: pulse-dot 1.2s infinite; }
.dot-neutral { background: var(--status-neutral); }
@keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:.35} }

.hidden { display: none !important; }

#theme-toggle {
  background: none; border: 1px solid var(--border-default);
  border-radius: var(--radius-element); color: var(--text-content-secondary);
  cursor: pointer; font-family: 'IBM Plex Mono', monospace;
  font-size: 10px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.06em; padding: 6px 12px; transition: all .18s;
}
#theme-toggle:hover { border-color: var(--border-strong); color: var(--accent-action); }

/* ===================================================================
   KPI ROW (3-4 summary blocks)
   =================================================================== */
.kpi-row {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 14px; margin-bottom: 20px; flex-shrink: 0;
}
.kpi-card {
  background: var(--bg-surface-secondary);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-container);
  padding: 16px 20px;
}
.kpi-card .kpi-label {
  font-family: 'IBM Plex Mono', monospace; font-size: 10px;
  font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--text-content-secondary); margin-bottom: 6px;
}
.kpi-card .kpi-value {
  font-family: 'Doto', 'IBM Plex Mono', monospace;
  font-size: 36px; font-weight: 700; line-height: 1;
  color: var(--text-content-primary);
}
.kpi-card .kpi-sub {
  font-size: 11px; color: var(--text-content-secondary); margin-top: 4px;
}

/* ===================================================================
   MAIN LAYOUT
   =================================================================== */
main {
  display: grid; grid-template-columns: 1fr 380px;
  gap: 20px; flex: 1; min-height: 0;
}

/* ===================================================================
   PRODUCT GRID
   =================================================================== */
.grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px;
}
.product-card {
  background: var(--bg-surface-secondary);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-container);
  padding: 22px 16px; text-align: center; cursor: pointer;
  user-select: none; -webkit-tap-highlight-color: transparent;
  transition: border-color .18s, background .18s, box-shadow .18s;
  display: flex; flex-direction: column; justify-content: center;
  align-items: center; min-height: 160px; position: relative;
}
.product-card:hover { background: var(--bg-surface-tertiary); }
.product-card.selected {
  border-color: var(--border-strong);
  box-shadow: 0 0 0 2px rgba(59,109,240,0.35);
}
.product-card.armed   { border-color: var(--border-strong); }
.product-card.busy    { border-color: var(--status-caution); }
.product-card.empty   { border-color: var(--status-negative); opacity: .55; pointer-events: none; }
.product-card.inactive { opacity: .3; pointer-events: none; }

.product-card .slot-num {
  font-family: 'IBM Plex Mono', monospace; font-size: 10px;
  font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--text-content-secondary); margin-bottom: 4px;
}
.product-card .product-name {
  font-family: 'Inter', sans-serif; font-size: 16px;
  font-weight: 600; color: var(--text-content-primary); margin-bottom: 6px;
}
.product-card .product-icon {
  width: 36px; height: 36px; border-radius: 50%; margin-bottom: 6px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'IBM Plex Mono', monospace; font-size: 13px;
  font-weight: 700; color: var(--text-content-secondary);
  border: 1px solid var(--border-default);
}
.product-card.armed .product-icon,
.product-card.busy .product-icon {
  border-color: var(--accent-action); color: var(--accent-action);
}
.product-card.empty .product-icon {
  border-color: var(--status-negative); color: var(--status-negative);
}
.product-card .armed-qty {
  font-family: 'Doto', 'IBM Plex Mono', monospace;
  font-size: 44px; font-weight: 700; line-height: 1;
  color: var(--text-content-primary); margin: 4px 0;
}
.product-card .armed-qty.is-zero   { color: #3A4050; }
.product-card .armed-qty.is-armed  { color: var(--accent-action); }
.product-card .armed-qty.is-busy   { color: var(--status-caution); }

.product-card .status-row {
  display: flex; justify-content: center; align-items: center;
  gap: 12px; margin-top: 6px; font-size: 11px; font-weight: 500;
}

/* ===================================================================
   RIGHT PANEL
   =================================================================== */
#right-panel { display: flex; flex-direction: column; gap: 14px; }
#right-panel section {
  background: var(--bg-surface-secondary);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-container);
  padding: 16px 20px;
}
.section-label {
  font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600;
  color: var(--text-content-secondary); text-transform: uppercase;
  letter-spacing: 0.05em; margin-bottom: 12px; padding-bottom: 8px;
  border-bottom: 1px solid var(--border-default);
  display: flex; justify-content: space-between; align-items: center;
}

/* Quick amounts */
.quick-amounts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 10px 0; }
.btn-amount {
  font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 600;
  padding: 14px 6px; background: var(--bg-surface-tertiary);
  border: 1px solid var(--border-default); border-radius: var(--radius-pill);
  color: var(--text-content-primary); cursor: pointer;
  transition: all .15s; touch-action: manipulation;
}
.btn-amount:hover { border-color: var(--border-strong); color: var(--accent-action); }
.btn-amount:active { background: var(--accent-action); color: #fff; transform: scale(.96); }
.btn-amount:disabled { opacity: .25; pointer-events: none; }

/* Staged items */
.staged-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 9px 0; border-bottom: 1px solid var(--border-default);
  font-size: 13px; animation: slide-in .18s ease;
}
.staged-row:last-child { border-bottom: none; }
.staged-row .staged-name { font-weight: 600; }
.staged-row .staged-price { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 14px; color: var(--text-content-primary); }
.staged-row .staged-meta { font-size: 11px; color: var(--text-content-secondary); }
.btn-remove {
  background: none; border: 1px solid var(--border-default);
  border-radius: 50%; color: var(--text-content-secondary);
  cursor: pointer; font-size: 14px; width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s; flex-shrink: 0;
}
.btn-remove:hover { border-color: var(--status-negative); color: var(--status-negative); }
@keyframes slide-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }

.sale-actions { display: flex; gap: 8px; margin: 10px 0; }
.sale-total {
  text-align: right; margin-top: 4px;
  font-family: 'Doto', 'IBM Plex Mono', monospace;
  font-size: 28px; font-weight: 700; color: var(--text-content-primary);
}

/* Buttons */
.btn {
  padding: 12px 20px; border: none; border-radius: var(--radius-pill);
  cursor: pointer; font-family: 'Inter', sans-serif; font-size: 13px;
  font-weight: 600; transition: all .15s;
  display: inline-flex; align-items: center; justify-content: center;
  touch-action: manipulation;
}
.btn-primary { background: var(--accent-action); color: #fff; }
.btn-primary:hover { background: var(--accent-action-hover); }
.btn-primary:disabled { opacity: .25; pointer-events: none; }
.btn-outline { flex: 1; background: transparent; border: 1px solid var(--border-default); color: var(--text-content-secondary); }
.btn-outline:hover { border-color: var(--border-strong); color: var(--accent-action); }
.btn-lg { padding: 16px 24px; font-size: 15px; }
.btn-block { display: block; width: 100%; }
.btn-sm {
  padding: 5px 12px; font-size: 11px; background: transparent;
  border: 1px solid var(--border-default); color: var(--text-content-secondary);
  cursor: pointer; border-radius: var(--radius-pill);
  font-family: 'Inter', sans-serif; font-weight: 500; transition: all .15s;
}
.btn-sm:hover { border-color: var(--border-strong); color: var(--accent-action); }
.btn-sm.retry { border-color: var(--accent-action); color: var(--accent-action); }
.btn-sm.retry:hover { background: var(--accent-action); color: #fff; }
.btn-sm.dismiss:hover { border-color: var(--status-negative); color: var(--status-negative); }
.btn-negative {
  background: transparent; border: 1px solid var(--status-negative);
  color: var(--status-negative); padding: 6px 14px; font-size: 11px;
  border-radius: var(--radius-pill); cursor: pointer;
  font-family: 'Inter', sans-serif; font-weight: 600; transition: all .15s;
  white-space: nowrap; flex-shrink: 0;
}
.btn-negative:hover { background: var(--status-negative); color: #fff; }

/* List rows */
.list-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 9px 0; border-bottom: 1px solid var(--border-default);
  font-size: 13px; gap: 8px;
}
.list-row:last-child { border-bottom: none; }
.list-row .list-val {
  font-family: 'IBM Plex Mono', monospace; font-weight: 600;
  font-size: 15px; color: var(--text-content-primary); white-space: nowrap;
}
.muted {
  color: var(--text-content-secondary); font-family: 'IBM Plex Mono', monospace;
  font-size: 11px; text-align: center; padding: 8px 0;
}

/* Alert card */
.alert-card {
  background: color-mix(in srgb, var(--status-negative) 8%, var(--bg-surface-secondary));
  border: 1px solid var(--status-negative);
  border-radius: var(--radius-container); padding: 14px 16px;
  color: var(--status-negative); font-size: 13px; font-weight: 500;
  margin-bottom: 10px;
}
.alert-card .alert-heading { font-weight: 700; margin-bottom: 4px; }

/* Empty state with CTA */
.empty-state {
  text-align: center; padding: 16px 8px; color: var(--text-content-secondary);
  font-size: 12px;
}
.empty-state .empty-action {
  display: inline-block; margin-top: 8px; font-family: 'IBM Plex Mono', monospace;
  font-size: 11px; font-weight: 600; color: var(--accent-action);
  cursor: pointer; text-transform: uppercase; letter-spacing: 0.04em;
}

/* Skeleton shimmer */
.skeleton {
  background: linear-gradient(90deg, var(--bg-surface-tertiary) 25%, var(--bg-surface-secondary) 50%, var(--bg-surface-tertiary) 75%);
  background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 4px;
}
@keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
.skeleton-text { height: 14px; margin-bottom: 8px; width: 60%; }
.skeleton-text.short { width: 40%; }
.skeleton-kpi { height: 36px; margin-bottom: 6px; width: 55%; }
.skeleton-card { height: 160px; border-radius: var(--radius-container); }

/* Offline banner */
#offline-banner {
  display: none; background: color-mix(in srgb, var(--status-negative) 10%, transparent);
  border: 1px solid var(--status-negative);
  border-radius: var(--radius-container); padding: 12px 16px; margin-bottom: 14px;
  color: var(--status-negative); font-size: 13px; font-weight: 500;
  text-align: center;
}
#offline-banner .offline-action {
  display: inline-block; margin-left: 8px; font-family: 'IBM Plex Mono', monospace;
  font-size: 11px; font-weight: 600; color: var(--status-negative);
  cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
}

/* Toast */
#toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
  background: var(--bg-surface-tertiary); border: 1px solid var(--border-default);
  border-radius: var(--radius-element); padding: 12px 24px;
  font-size: 13px; color: var(--text-content-primary);
  opacity: 0; transition: all .25s ease; pointer-events: none; z-index: 100;
}
#toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.success { border-color: var(--status-positive); color: var(--status-positive); }
#toast.error   { border-color: var(--status-negative); color: var(--status-negative); }

/* ===================================================================
   RESPONSIVE
   =================================================================== */
@media (max-width: 1440px) {
  main { grid-template-columns: 1fr 360px; }
}
@media (max-width: 768px) {
  body { padding: 12px; }
  main { grid-template-columns: 1fr; }
  .kpi-row { grid-template-columns: repeat(2, 1fr); }
  .grid { grid-template-columns: repeat(2, 1fr); }
  #right-panel { max-height: none; }
}
@media (max-width: 375px) {
  .kpi-row { grid-template-columns: 1fr 1fr; gap: 8px; }
  .kpi-card { padding: 12px 14px; }
  .kpi-card .kpi-value { font-size: 28px; }
  .grid { grid-template-columns: 1fr 1fr; gap: 8px; }
  .product-card { min-height: 140px; padding: 16px 12px; }
  .product-card .armed-qty { font-size: 34px; }
  .quick-amounts { grid-template-columns: repeat(2, 1fr); }
  #status-bar { flex-wrap: wrap; gap: 8px; font-size: 10px; }
}
</style>
</head>
<body>

<header id="status-bar">
  <div class="status-left">
    <span id="machine-status"><span class="dot dot-neutral"></span> Connecting</span>
    <span>Machine 001</span>
  </div>
  <div class="status-center">
    <span id="pause-indicator" class="hidden" style="color:var(--status-caution);font-weight:600;">PAUSED</span>
  </div>
  <div class="status-right">
    <button id="theme-toggle">LIGHT</button>
    <span id="last-update">--:--:--</span>
  </div>
</header>

<div id="offline-banner">
  Machine unreachable. <span id="offline-retry" class="offline-action">Retry connection</span>
</div>

<!-- KPI Row -->
<div class="kpi-row" id="kpi-row">
  <div class="kpi-card"><div class="kpi-label">Total Armed</div><div class="kpi-value" id="kpi-armed">0</div><div class="kpi-sub">units across all slots</div></div>
  <div class="kpi-card"><div class="kpi-label">Active Slots</div><div class="kpi-value" id="kpi-active" style="color:var(--status-positive);">4</div><div class="kpi-sub">of 6 operational</div></div>
  <div class="kpi-card"><div class="kpi-label">Bundle</div><div class="kpi-value" id="kpi-bundle">0/4</div><div class="kpi-sub" id="kpi-bundle-sub">slots in stock</div></div>
  <div class="kpi-card"><div class="kpi-label">Today</div><div class="kpi-value" id="kpi-today">0</div><div class="kpi-sub">dispenses completed</div></div>
</div>

<main>
  <section><div class="grid" id="grid-container"></div></section>

  <aside id="right-panel">
    <section>
      <div class="section-label">New Sale</div>
      <div id="staged-items"><span class="muted">Select product, then amount</span></div>
      <div class="quick-amounts">
        <button class="btn-amount" data-amount="5">P 5</button>
        <button class="btn-amount" data-amount="10">P 10</button>
        <button class="btn-amount" data-amount="15">P 15</button>
        <button class="btn-amount" data-amount="20">P 20</button>
      </div>
      <div class="sale-actions">
        <button id="btn-add-more" class="btn btn-outline">Add More</button>
        <button id="btn-clear-sale" class="btn btn-outline">Clear</button>
      </div>
      <button id="btn-arm" class="btn btn-primary btn-block btn-lg" disabled>Arm</button>
      <div id="sale-total" class="sale-total">P 0</div>
    </section>

    <section>
      <div class="section-label">Armed <span id="armed-count" style="font-weight:400;font-size:11px;">0</span></div>
      <div id="armed-list"><span class="muted">--</span></div>
    </section>

    <section>
      <div class="section-label">Queue <span id="queue-count" style="font-weight:400;font-size:11px;">0</span></div>
      <div id="queue-list"><span class="muted">--</span></div>
    </section>

    <section>
      <div class="section-label">Attention</div>
      <div id="unclaimed-list"><span class="muted">--</span></div>
    </section>

    <section>
      <div class="section-label">Alerts</div>
      <div id="alert-list"><span class="muted">--</span></div>
    </section>
  </aside>
</main>

<div id="toast"></div>

<script>
(function() {
  'use strict';

  const PRODUCT = {
    1: 'Deesh Premium', 2: 'Lanz Blossom', 3: 'Lanz Dainty',
    4: 'Switch', 5: 'Slot 5', 6: 'Slot 6',
  };
  const PRODUCT_INITIAL = { 1:'D', 2:'LB', 3:'LD', 4:'S', 5:'5', 6:'6' };
  const AMOUNT_QTY = { 5:1, 10:2, 15:3, 20:4 };
  const ACTIVE = 4, TOTAL = 6;

  const S = {
    armedQty: new Array(7).fill(0), remaining: new Array(5).fill(0),
    wlvl: new Array(5).fill(false), busy: new Array(7).fill(false),
    queueDepth: new Array(7).fill(0), paused: false,
    lastUpdate: null, connected: false,
  };
  let selProduct = null, staged = [], unclaimed = [], saleCtr = 0, dispenseCount = 0;
  const $ = (id) => document.getElementById(id);

  // Toast
  let toastTmr;
  function toast(msg, type) {
    const el = $('toast'); el.textContent = msg;
    el.className = 'visible' + (type ? ' ' + type : '');
    clearTimeout(toastTmr); toastTmr = setTimeout(() => el.className = '', 2600);
  }

  // SSE
  function connectSSE() {
    const es = new EventSource('/api/status/stream');
    es.addEventListener('message', (e) => {
      if (e.data === 'connected') { S.connected = true; refresh(); return; }
      if (e.data.startsWith('UNCLAIMED:')) { addUnclaimed(e.data); return; }
      parse(e.data);
    });
    es.addEventListener('error', () => { S.connected = false; refresh(); });
  }

  function parse(raw) {
    const p = raw.split(','); if (p.length < 18) return;
    let i = 1;
    for (let s = 1; s <= 4; s++) S.armedQty[s]   = parseInt(p[i++]) || 0;
    for (let s = 1; s <= 4; s++) S.remaining[s]  = parseInt(p[i++]) || 0;
    for (let s = 1; s <= 4; s++) S.wlvl[s]       = p[i++] === '1';
    for (let s = 1; s <= 4; s++) S.busy[s]        = p[i++] === '1';
    for (let s = 1; s <= 4; s++) S.queueDepth[s]  = parseInt(p[i++]) || 0;
    S.paused = p[i] === '1'; S.lastUpdate = new Date(); refresh();
  }

  function addUnclaimed(raw) {
    const p = raw.substring(10).split(',');
    if (p.length >= 3) {
      unclaimed.push({ slot: +p[0], qty: +p[1], amount: +p[2], time: p[3] || '' });
      renderUnclaimed();
    }
  }

  // KPIs
  function refresh() {
    updateStatus();
    updateKPIs();
    renderGrid();
    renderArmed();
    renderQueue();
    renderAlerts();
    renderUnclaimed();
  }

  function updateStatus() {
    if (S.connected) {
      $('machine-status').innerHTML = '<span class="dot dot-positive"></span> Online';
      $('offline-banner').style.display = 'none';
    } else {
      $('machine-status').innerHTML = '<span class="dot dot-negative"></span> Offline';
      $('offline-banner').style.display = 'block';
    }
    $('pause-indicator').classList.toggle('hidden', !S.paused);
    if (S.lastUpdate) $('last-update').textContent = S.lastUpdate.toLocaleTimeString('en-US', { hour12: false });
  }

  function updateKPIs() {
    let armed = 0, inStock = 0;
    for (let s = 1; s <= ACTIVE; s++) { armed += S.armedQty[s]; if (!S.wlvl[s]) inStock++; }
    $('kpi-armed').textContent = armed;
    $('kpi-active').textContent = inStock;
    $('kpi-active').style.color = inStock === ACTIVE ? 'var(--status-positive)' : (inStock >= 2 ? 'var(--status-caution)' : 'var(--status-negative)');
    $('kpi-bundle').textContent = inStock + '/' + ACTIVE;
    $('kpi-bundle-sub').textContent = inStock === ACTIVE ? 'all slots in stock' : (ACTIVE - inStock) + ' need refill';
    $('kpi-today').textContent = dispenseCount;
  }

  // Grid
  function renderGrid() {
    let h = '';
    for (let s = 1; s <= TOTAL; s++) {
      const act = s <= ACTIVE, armed = S.armedQty[s] || 0, busy = S.busy[s],
            empty = S.wlvl[s], sel = selProduct === s;
      let cls = 'product-card';
      if (!act) cls += ' inactive'; else if (busy) cls += ' busy';
      else if (empty) cls += ' empty'; else if (armed > 0) cls += ' armed';
      if (sel) cls += ' selected';

      let dotHtml, dotColor;
      if (!act)      { dotHtml = '<span class="dot dot-neutral"></span> N/A';   dotColor = 'var(--text-content-secondary)'; }
      else if (busy) { dotHtml = '<span class="dot dot-caution"></span> Busy';  dotColor = 'var(--status-caution)'; }
      else if (armed){ dotHtml = '<span class="dot dot-accent"></span> Armed';   dotColor = 'var(--accent-action)'; }
      else if (empty){ dotHtml = '<span class="dot dot-negative"></span> Empty'; dotColor = 'var(--status-negative)'; }
      else           { dotHtml = '<span class="dot dot-neutral"></span> Idle';   dotColor = 'var(--text-content-secondary)'; }

      const qCls = !act || armed === 0 ? 'is-zero' : (busy ? 'is-busy' : 'is-armed');

      h += '<div class="'+cls+'" data-slot="'+s+'">';
      h += '<div class="slot-num">SLOT '+String(s).padStart(2,'0')+'</div>';
      h += '<div class="product-icon">'+PRODUCT_INITIAL[s]+'</div>';
      h += '<div class="product-name">'+PRODUCT[s]+'</div>';
      h += '<div class="armed-qty '+qCls+'">'+(act ? armed : '--')+'</div>';
      h += '<div class="status-row" style="color:'+dotColor+'">'+dotHtml+'</div>';
      h += '</div>';
    }
    $('grid-container').innerHTML = h;
    $('grid-container').querySelectorAll('.product-card').forEach(c => {
      c.addEventListener('click', () => {
        const s = +c.dataset.slot;
        if (s <= ACTIVE && !S.wlvl[s]) selectProduct(s);
      });
    });
  }

  // Right panel
  function renderArmed() {
    let h = '', cnt = 0;
    for (let s = 1; s <= ACTIVE; s++) {
      if (S.armedQty[s] > 0 || S.busy[s]) {
        cnt += S.armedQty[s];
        const dot = S.busy[s] ? '<span class="dot dot-caution"></span>' : '<span class="dot dot-accent"></span>';
        h += '<div class="list-row">'+dot+' <span style="font-weight:600;">'+PRODUCT[s]+'</span>';
        h += '<span class="list-val">'+S.armedQty[s]+'</span>';
        h += '<button class="btn-negative" data-slot="'+s+'">Cancel</button></div>';
      }
    }
    $('armed-count').textContent = cnt;
    $('armed-list').innerHTML = h || '<span class="muted">--</span>';
    $('armed-list').querySelectorAll('.btn-negative').forEach(b => {
      b.addEventListener('click', () => cancelSlot(+b.dataset.slot));
    });
  }

  function renderQueue() {
    let h = '', cnt = 0;
    for (let s = 1; s <= ACTIVE; s++) {
      if (S.queueDepth[s] > 0) {
        cnt += S.queueDepth[s];
        h += '<div class="list-row"><span style="font-weight:600;">'+PRODUCT[s]+'</span><span class="list-val">'+S.queueDepth[s]+' pending</span></div>';
      }
    }
    $('queue-count').textContent = cnt;
    $('queue-list').innerHTML = h || '<span class="muted">--</span>';
  }

  function renderAlerts() {
    let issues = '';
    for (let s = 1; s <= ACTIVE; s++) {
      if (S.wlvl[s]) issues += '<div class="list-row" style="color:var(--status-negative);"><span><span class="dot dot-negative"></span> SLOT '+String(s).padStart(2,'0')+': '+PRODUCT[s]+'</span><span>[EMPTY]</span></div>';
    }
    if (!S.connected) issues += '<div class="list-row" style="color:var(--status-negative);"><span><span class="dot dot-negative"></span> Machine offline</span><span>[OFFLINE]</span></div>';
    if (issues) {
      $('alert-list').innerHTML = '<div class="alert-card"><div class="alert-heading">'+issues.split('class="list-row"').length+' issue(s) detected</div>'+issues+'</div>';
    } else {
      $('alert-list').innerHTML = '<span class="muted">--</span>';
    }
  }

  function renderUnclaimed() {
    if (!unclaimed.length) { $('unclaimed-list').innerHTML = '<span class="muted">--</span>'; return; }
    let h = '';
    unclaimed.forEach((it, idx) => {
      h += '<div class="list-row" style="color:var(--status-caution);">';
      h += '<span><span class="dot dot-caution"></span> SLOT '+String(it.slot).padStart(2,'0')+': '+it.qty+'u -- P'+it.amount+'</span>';
      h += '<span style="display:flex;gap:4px;">';
      h += '<button class="btn-sm retry" data-idx="'+idx+'" data-act="retry">Retry</button>';
      h += '<button class="btn-sm dismiss" data-idx="'+idx+'" data-act="dismiss">Dismiss</button>';
      h += '</span></div>';
    });
    $('unclaimed-list').innerHTML = h;
    $('unclaimed-list').querySelectorAll('[data-idx]').forEach(b => {
      b.addEventListener('click', () => resolveUnclaimed(+b.dataset.idx, b.dataset.act));
    });
  }

  // Sale
  function selectProduct(id) { selProduct = id; renderGrid(); document.querySelectorAll('.btn-amount').forEach(b => b.disabled = false); }
  function stageItem(id, amt) {
    staged.push({ id, name: PRODUCT[id], amt, qty: AMOUNT_QTY[amt]||1 });
    selProduct = null; renderStaged(); renderGrid(); updateArm();
    document.querySelectorAll('.btn-amount').forEach(b => b.disabled = true);
  }
  function removeStaged(i) { staged.splice(i,1); renderStaged(); updateArm(); }
  function renderStaged() {
    if (!staged.length) { $('staged-items').innerHTML = '<span class="muted">Select product, then amount</span>'; $('sale-total').textContent = 'P 0'; return; }
    let h = '', t = 0;
    staged.forEach((it, i) => {
      t += it.amt;
      h += '<div class="staged-row"><span><span class="staged-name">'+it.name+'</span> <span class="staged-meta">('+it.qty+'u)</span></span><span class="staged-price">P '+it.amt+'</span><button class="btn-remove" data-idx="'+i+'">x</button></div>';
    });
    $('staged-items').innerHTML = h; $('sale-total').textContent = 'P '+t;
    $('staged-items').querySelectorAll('.btn-remove').forEach(b => b.addEventListener('click', () => removeStaged(+b.dataset.idx)));
  }
  function updateArm() {
    $('btn-arm').disabled = !staged.length;
    $('btn-arm').textContent = staged.length ? 'Arm '+staged.length+' Slot'+(staged.length>1?'s':'') : 'Arm';
  }

  // API
  async function executeArm() {
    if (!staged.length) return;
    $('btn-arm').disabled = true; $('btn-arm').textContent = 'Working...';
    const sid = 'SALE-'+Date.now()+'-'+(++saleCtr);
    try {
      const r = await fetch('/api/arm', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ saleId:sid, items:staged.map(i=>({productId:i.id,qty:i.qty})) }) });
      const d = await r.json();
      const bad = d.results.filter(r => !r.success);
      if (bad.length) {
        toast('Failed: '+bad.map(f=>'Slot '+String(f.productId).padStart(2,'0')).join(', '), 'error');
      } else {
        dispenseCount += staged.length;
        toast('Armed: '+staged.map(i=>i.name).join(', '), 'success');
        staged = []; selProduct = null; renderStaged(); renderGrid(); updateArm();
        document.querySelectorAll('.btn-amount').forEach(b => b.disabled = true);
      }
    } catch(e) { toast('Error: '+e.message, 'error'); }
    finally { updateArm(); }
  }
  async function cancelSlot(id) {
    try { await fetch('/api/cancel', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({productId:id}) }); }
    catch(e) { /* silent */ }
  }
  async function resolveUnclaimed(idx, action) {
    const it = unclaimed[idx];
    try {
      await fetch('/api/unclaimed/resolve', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({slot:it.slot,qty:it.qty,amount:it.amount,action}) });
      unclaimed.splice(idx,1); renderUnclaimed();
    } catch(e) { /* silent */ }
  }

  // Theme
  const html = document.documentElement;
  const saved = localStorage.getItem('sabon-theme');
  if (saved) html.setAttribute('data-theme', saved);
  $('theme-toggle').textContent = html.getAttribute('data-theme') === 'dark' ? 'LIGHT' : 'DARK';
  $('theme-toggle').addEventListener('click', () => {
    const nxt = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', nxt);
    localStorage.setItem('sabon-theme', nxt);
    $('theme-toggle').textContent = nxt === 'dark' ? 'LIGHT' : 'DARK';
  });

  // Offline retry
  $('offline-retry').addEventListener('click', () => { connectSSE(); });

  // Sale events
  document.querySelectorAll('.btn-amount').forEach(b => {
    b.disabled = true;
    b.addEventListener('click', () => { if (selProduct !== null) stageItem(selProduct, +b.dataset.amount); });
  });
  $('btn-add-more').addEventListener('click', () => { selProduct = null; renderGrid(); document.querySelectorAll('.btn-amount').forEach(b => b.disabled = true); });
  $('btn-clear-sale').addEventListener('click', () => { staged = []; selProduct = null; renderStaged(); renderGrid(); updateArm(); document.querySelectorAll('.btn-amount').forEach(b => b.disabled = true); });
  $('btn-arm').addEventListener('click', executeArm);

  // Init
  renderGrid();
  connectSSE();

  // Skeleton timeout: if no connection after 4s, show demo
  setTimeout(() => {
    if (!S.connected) {
      S.armedQty[1] = 2; S.armedQty[2] = 1; S.busy[3] = true;
      S.wlvl[4] = true; S.queueDepth[2] = 1;
      S.lastUpdate = new Date(); refresh();
    }
  }, 4000);
})();
</script>
</body>
</html>
