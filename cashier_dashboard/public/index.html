<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Sabon Vendo</title>
<style>
/* ===================================================================
   Sabon Vendo — Cashier Dashboard
   Token naming: bg-surface-primary, text-content-secondary, etc.
   Breakpoints: 1440px desktop / 768px tablet / 375px mobile
   =================================================================== */

/* Poppins loaded locally — fully offline */
@font-face { font-family: 'Inter'; src: url('fonts/inter-v20-latin-regular.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: 'Inter'; src: url('fonts/inter-v20-latin-500.woff2') format('woff2'); font-weight: 500; font-style: normal; font-display: swap; }
@font-face { font-family: 'Inter'; src: url('fonts/inter-v20-latin-600.woff2') format('woff2'); font-weight: 600; font-style: normal; font-display: swap; }
@font-face { font-family: 'Inter'; src: url('fonts/inter-v20-latin-700.woff2') format('woff2'); font-weight: 700; font-style: normal; font-display: swap; }
@font-face { font-family: 'Poppins'; src: url('fonts/poppins-v24-latin-regular.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: 'Poppins'; src: url('fonts/poppins-v24-latin-500.woff2') format('woff2'); font-weight: 500; font-style: normal; font-display: swap; }
@font-face { font-family: 'Poppins'; src: url('fonts/poppins-v24-latin-600.woff2') format('woff2'); font-weight: 600; font-style: normal; font-display: swap; }
@font-face { font-family: 'Poppins'; src: url('fonts/poppins-v24-latin-700.woff2') format('woff2'); font-weight: 700; font-style: normal; font-display: swap; }

:root {
  --bg-surface-primary:   #0B0E14;
  --bg-surface-secondary: #141925;
  --bg-surface-tertiary:  #1C2333;
  --border-default:       #232A3B;
  --border-strong:        #3B6DF0;
  --text-content-primary: #F5F7FA;
  --text-content-secondary: #8A93A6;
  --text-content-inverse: #0B0E14;
  --accent-action:        #3B6DF0;
  --accent-action-hover:  #507DF4;
  --status-positive:      #34D399;
  --status-caution:       #FBBF24;
  --status-negative:      #F87171;
  --status-neutral:       #4B5263;
  --radius-container:     14px;
  --radius-element:       8px;
  --radius-pill:          999px;
  --space-unit: 8px;
  font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  font-size: 14px;
  color: var(--text-content-primary);
  background: var(--bg-surface-primary);
}
[data-theme="light"] {
  --bg-surface-primary:   #F3F4F6;
  --bg-surface-secondary: #FFFFFF;
  --bg-surface-tertiary:  #F0F1F3;
  --border-default:       #D1D5DB;
  --border-strong:        #3B6DF0;
  --text-content-primary: #1A1A1A;
  --text-content-secondary: #6B7280;
  --text-content-inverse: #FFFFFF;
  --status-positive:      #16A34A;
  --status-caution:       #D97706;
  --status-negative:      #DC2626;
  --status-neutral:       #9CA3AF;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  max-width: 1280px; margin: 0 auto;
  min-height: 100dvh;
  padding: 10px 14px; display: flex; flex-direction: column;
  user-select: none; -webkit-user-select: none;
  cursor: default;
  font-size: 15px;
}

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-default); border-radius: 3px; }

/* ===================================================================
   HEADER
   =================================================================== */
#status-bar {
  display: flex; justify-content: space-between; align-items: center;
  background: var(--bg-surface-secondary);
  border: 1px solid var(--border-default);
  border-radius: 10px;
  padding: 10px 18px; margin-bottom: 10px; flex-shrink: 0;
  font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 12px;
  color: var(--text-content-secondary);
}
.status-left, .status-center, .status-right {
  display: flex; align-items: center; gap: 20px;
}

/* Status dot (8px) */
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; flex-shrink: 0; }
.dot-positive { background: var(--status-positive); box-shadow: 0 0 6px rgba(52,211,153,.35); }
.dot-negative { background: var(--status-negative); box-shadow: 0 0 6px rgba(248,113,113,.35); }
.dot-accent  { background: var(--accent-action);  box-shadow: 0 0 8px rgba(59,109,240,.4); }
.dot-caution { background: var(--status-caution); box-shadow: 0 0 8px rgba(251,191,36,.4); animation: pulse-dot 1.2s infinite; }
.dot-neutral { background: var(--status-neutral); }
@keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:.35} }

.hidden { display: none !important; }

#theme-toggle {
  background: none; border: 1px solid var(--border-default);
  border-radius: var(--radius-element); color: var(--text-content-secondary);
  cursor: pointer; font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  font-size: 10px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.06em; padding: 6px 12px; transition: all .18s;
}

/* ===================================================================
   KPI ROW (3-4 summary blocks)
   =================================================================== */
.kpi-row {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 10px; margin-bottom: 10px; flex-shrink: 0;
}
.kpi-card {
  background: var(--bg-surface-secondary);
  border: 1px solid var(--border-default);
  border-radius: 10px;
  padding: 12px 18px; min-height: 80px;
  border-top: 3px solid transparent;
}
.kpi-card:nth-child(1) { border-top-color: var(--accent-action); }
.kpi-card:nth-child(2) { border-top-color: var(--status-positive); }
.kpi-card:nth-child(3) { border-top-color: var(--status-caution); }
.kpi-card:nth-child(4) { border-top-color: #8B5CF6; }
.kpi-card .kpi-label {
  font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 10px;
  font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em;
  color: var(--text-content-secondary); margin-bottom: 2px;
}
.kpi-card .kpi-value {
  font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  font-size: 32px; font-weight: 700; line-height: 1;
  color: var(--text-content-primary);
}
.kpi-card .kpi-sub {
  font-size: 10px; color: var(--text-content-secondary); margin-top: 2px;
}

/* ===================================================================
   MAIN LAYOUT
   =================================================================== */
/* Sale Strip */
#sale-strip {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg-surface-secondary);
  border: 1px solid var(--border-default);
  border-radius: 10px;
  padding: 6px 12px; margin-bottom: 8px; flex-shrink: 0;
  min-height: 44px; flex-wrap: wrap;
}
#sale-strip #staged-items {
  flex: 1; min-width: 140px; font-size: 12px;
  display: grid; grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(2, auto); gap: 8px;
  align-items: start;
}
#sale-strip .staged-card {
  display: grid; grid-template-columns: 1fr 22px;
  grid-template-rows: auto auto;
  align-items: center;
  background: var(--bg-surface-secondary);
  border: 1px solid var(--accent-action); border-radius: 8px;
  padding: 8px 10px 8px 14px; width: 100%; min-width: 0; max-width: none;
  min-height: 52px;
}
.staged-card .staged-card-name {
  font-size: 12px; font-weight: 600; color: var(--text-content-primary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  grid-column: 1;
}
.staged-card .staged-card-qty {
  font-size: 15px; font-weight: 700; color: var(--accent-action);
  grid-column: 1; grid-row: 2;
}
.staged-card .staged-card-remove {
  grid-column: 2; grid-row: 1 / 3;
  background: none; border: none; color: var(--text-content-secondary);
  cursor: pointer; font-size: 16px; line-height: 1;
  padding: 4px; text-align: center; align-self: center;
}
.sale-controls {
  display: flex; align-items: center; gap: 10px; flex-shrink: 0;
}
.qty-stepper {
  display: flex; align-items: center; gap: 0;
  border: 1px solid var(--border-default); border-radius: 8px; overflow: hidden;
  height: 44px; flex-shrink: 0;
}
.qty-stepper .stepper-btn {
  width: 38px; height: 100%; border: none;
  border-radius: 0; background: var(--bg-surface-tertiary);
  color: var(--text-content-primary); cursor: pointer;
  font-size: 18px; font-weight: 700; display: flex; align-items: center;
  justify-content: center; font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  transition: all .15s;
}
.qty-stepper .stepper-btn:disabled { opacity: .25; pointer-events: none; }
.qty-stepper input {
  width: 48px; height: 100%; background: var(--bg-surface-secondary);
  border: none; border-left: 1px solid var(--border-default);
  border-right: 1px solid var(--border-default);
  padding: 0 2px; color: var(--text-content-primary);
  font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  font-size: 18px; font-weight: 700;
  text-align: center; outline: none;
  -moz-appearance: textfield;
}
.qty-stepper input::-webkit-outer-spin-button,
.qty-stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
#sale-strip .btn, #sale-strip .btn-confirm {
  height: 44px; padding: 0 18px; font-size: 13px; font-weight: 600;
  border-radius: 8px; line-height: 1;
}
#sale-strip .btn-primary { background: var(--accent-action); color: #fff; border: 1px solid transparent; }
#sale-strip .btn-outline { background: transparent; border: 1px solid var(--border-default); color: var(--text-content-primary); flex: 0 0 auto; }
#sale-strip .sale-total { font-size: 22px; margin: 0 0 0 8px; white-space: nowrap; min-width: 50px; text-align: right; font-weight: 700; }

/* Status-only right panel */
.status-section {
  background: var(--bg-surface-secondary);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-container);
  padding: 10px 14px; margin-bottom: 8px;
}
.status-section .section-label { margin-bottom: 4px; padding-bottom: 4px; font-size: 10px; }
.status-section .list-row { padding: 4px 0; font-size: 11px; }
.status-section .list-val { font-size: 13px; }

main {
  display: grid; grid-template-columns: 1fr 260px;
  gap: 12px; flex: 1; min-height: 0;
}

/* ===================================================================
   PRODUCT GRID
   =================================================================== */
.grid {
  display: grid; grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(2, 1fr); gap: 8px;
  min-height: 300px;
}
.product-card {
  background: var(--bg-surface-secondary);
  border: 1px solid var(--border-default);
  border-radius: 10px; cursor: pointer; overflow: hidden;
  user-select: none; -webkit-tap-highlight-color: transparent;
  transition: border-color .2s, box-shadow .2s, transform .2s;
  display: flex; align-items: center; gap: 16px;
  padding: 16px; min-height: 100px; position: relative;
}
.product-card.armed {
  border-color: var(--status-positive);
  box-shadow: 0 0 0 3px rgba(52,211,153,0.28);
}
.product-card.selected {
  border-color: var(--border-strong);
  box-shadow: 0 0 0 3px rgba(59,109,240,0.28);
}
.product-card.busy {
  border-color: var(--status-caution);
  box-shadow: 0 0 0 3px rgba(251,191,36,0.25);
}
.product-card.busy .product-icon {
  animation: pulse-busy .8s ease-in-out infinite;
}
.product-card.empty {
  border-color: var(--status-negative);
  box-shadow: 0 0 0 3px rgba(248,113,113,0.25);
  pointer-events: none;
}
.product-card.empty .product-icon { filter: saturate(0.4); }
.product-card.inactive { opacity: .3; pointer-events: none; }

/* Icon tile */
.product-icon {
  width: 22%; max-width: 64px;
  aspect-ratio: 1 / 1;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  background: var(--tile-bg, #1C2333);
  color: var(--tile-icon, #8A93A6);
  transition: background .2s, color .2s;
}
.product-icon svg {
  width: 55%; height: 55%;
}

/* Per-product tile colors -- dark theme (default) */
[data-product="1"] { --tile-bg: #2A2450; --tile-icon: #8B82E0; }
[data-product="2"] { --tile-bg: #1A3050; --tile-icon: #5B9BD5; }
[data-product="3"] { --tile-bg: #1A3A30; --tile-icon: #4DB89E; }
[data-product="4"] { --tile-bg: #3A2018; --tile-icon: #D4856A; }
[data-product="5"] { --tile-bg: #3A2A15; --tile-icon: #C89240; }
[data-product="6"] { --tile-bg: #253A18; --tile-icon: #6BA830; }

/* Per-product tile colors -- light theme override */
[data-theme="light"] [data-product="1"] { --tile-bg: #EEEDFE; --tile-icon: #534AB7; }
[data-theme="light"] [data-product="2"] { --tile-bg: #E6F1FB; --tile-icon: #185FA5; }
[data-theme="light"] [data-product="3"] { --tile-bg: #E1F5EE; --tile-icon: #0F6E56; }
[data-theme="light"] [data-product="4"] { --tile-bg: #FAECE7; --tile-icon: #993C1D; }
[data-theme="light"] [data-product="5"] { --tile-bg: #FAEEDA; --tile-icon: #854F0B; }
[data-theme="light"] [data-product="6"] { --tile-bg: #EAF3DE; --tile-icon: #3B6D11; }

/* Pulse animations */
@keyframes pulse-arm {
  0%   { transform: scale(1); }
  50%  { transform: scale(1.18); }
  100% { transform: scale(1); }
}
@keyframes pulse-busy {
  0%, 100% { opacity: 1; }
  50%      { opacity: .55; }
}
.armed-qty.pulse-arm {
  animation: pulse-arm .4s ease;
}

/* Text panel */
.product-card .text-panel {
  padding: 8px 0 8px 4px;
  display: flex; flex-direction: column; justify-content: center;
  gap: 1px; min-width: 0;
}
.product-card .slot-num {
  font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  font-size: 8px; font-weight: 500; text-transform: uppercase;
  letter-spacing: 0.06em; color: var(--text-content-secondary);
}
.product-card .product-name {
  font-family: 'Inter', sans-serif; font-size: 13px;
  font-weight: 600; color: var(--text-content-primary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.product-card .armed-qty {
  font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  font-size: 32px; font-weight: 700; line-height: 1;
  color: var(--text-content-primary); margin: 2px 0;
}
.product-card .armed-qty.is-zero   { color: #3A4050; }
.product-card .armed-qty.is-armed  { color: var(--status-positive); }
.product-card .armed-qty.is-selected { color: var(--accent-action); }
.product-card .armed-qty.is-busy   { color: var(--status-caution); }

.product-card .status-row {
  display: flex; align-items: center;
  gap: 6px; margin-top: 2px; font-size: 10px; font-weight: 500;
}

/* ===================================================================
   RIGHT PANEL
   =================================================================== */
#right-panel { display: flex; flex-direction: column; gap: 10px; }
#right-panel section {
  background: var(--bg-surface-secondary);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-container);
  padding: 12px 16px;
  border-left: 3px solid transparent;
}
#right-panel section:nth-child(1) { border-left-color: var(--accent-action); }
#right-panel section:nth-child(2) { border-left-color: var(--status-positive); }
#right-panel section:nth-child(3) { border-left-color: var(--status-caution); }
#right-panel section:nth-child(4) { border-left-color: #8B5CF6; }
#right-panel section:nth-child(5) { border-left-color: var(--status-negative); }
.section-label {
  font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600;
  color: var(--text-content-secondary); text-transform: uppercase;
  letter-spacing: 0.05em; margin-bottom: 12px; padding-bottom: 8px;
  border-bottom: 1px solid var(--border-default);
  display: flex; justify-content: space-between; align-items: center;
}

/* Staged items */
.staged-row {
  display: grid; grid-template-columns: 1fr auto 30px; align-items: center;
  gap: 8px; padding: 10px 6px; border-bottom: 1px solid var(--border-default);
  font-size: 13px; animation: slide-in .18s ease;
}
.staged-row:last-child { border-bottom: none; }
.staged-row .staged-info { text-align: left; }
.staged-row .staged-name { font-weight: 600; }
.staged-row .staged-qty {
  font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 15px;
  color: var(--accent-action); text-align: center;
  background: color-mix(in srgb, var(--accent-action) 10%, transparent);
  padding: 4px 12px; border-radius: var(--radius-pill);
  white-space: nowrap;
}
.staged-row .staged-meta { font-size: 11px; color: var(--text-content-secondary); }
.btn-remove {
  background: none; border: 1px solid var(--border-default);
  border-radius: 50%; color: var(--text-content-secondary);
  cursor: pointer; font-size: 14px; width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s; flex-shrink: 0;
}
@keyframes slide-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }

.sale-total {
  text-align: right; margin-top: 4px;
  font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  font-size: 22px; font-weight: 700; color: var(--text-content-primary);
  white-space: nowrap;
}

/* Buttons */
.btn {
  padding: 12px 20px; border: none; border-radius: var(--radius-pill);
  cursor: pointer; font-family: 'Inter', sans-serif; font-size: 13px;
  font-weight: 600; transition: all .15s;
  display: inline-flex; align-items: center; justify-content: center;
  touch-action: manipulation;
}
.btn-primary { background: var(--accent-action); color: #fff; }
.btn-primary:disabled { opacity: .25; pointer-events: none; }
.btn-outline { flex: 1; background: transparent; border: 1px solid var(--border-default); color: var(--text-content-secondary); }
.btn-lg { padding: 16px 24px; font-size: 15px; }
.btn-block { display: block; width: 100%; }
.btn-sm {
  padding: 5px 12px; font-size: 11px; background: transparent;
  border: 1px solid var(--border-default); color: var(--text-content-secondary);
  cursor: pointer; border-radius: var(--radius-pill);
  font-family: 'Inter', sans-serif; font-weight: 500; transition: all .15s;
}
.btn-sm.retry { border-color: var(--accent-action); color: var(--accent-action); }
.btn-negative {
  background: transparent; border: 1px solid var(--status-negative);
  color: var(--status-negative); padding: 6px 14px; font-size: 11px;
  border-radius: var(--radius-pill); cursor: pointer;
  font-family: 'Inter', sans-serif; font-weight: 600; transition: all .15s;
  white-space: nowrap; flex-shrink: 0;
}

/* List rows */
.list-row {
  display: grid; grid-template-columns: 20px 1fr auto auto;
  align-items: center; gap: 8px;
  padding: 8px 0; border-bottom: 1px solid var(--border-default);
  font-size: 13px; min-height: 44px;
}
.list-row:last-child { border-bottom: none; }
.list-row .list-name {
  font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.list-row .list-val {
  font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 600;
  font-size: 15px; color: var(--text-content-primary);
  text-align: right; font-variant-numeric: tabular-nums;
  white-space: nowrap; min-width: 28px;
}
.list-row .btn-negative, .list-row .btn-sm {
  width: 60px; text-align: center;
}
.muted {
  color: var(--text-content-secondary); font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  font-size: 11px; text-align: center; padding: 8px 0;
}

/* Alert card */
.alert-card {
  background: color-mix(in srgb, var(--status-negative) 8%, var(--bg-surface-secondary));
  border: 1px solid var(--status-negative);
  border-radius: var(--radius-container); padding: 14px 16px;
  color: var(--status-negative); font-size: 13px; font-weight: 500;
  margin-bottom: 10px;
}
.alert-card .alert-heading { font-weight: 700; margin-bottom: 4px; }

/* Empty state with CTA */
.empty-state {
  text-align: center; padding: 16px 8px; color: var(--text-content-secondary);
  font-size: 12px;
}
.empty-state .empty-action {
  display: inline-block; margin-top: 8px; font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  font-size: 11px; font-weight: 600; color: var(--accent-action);
  cursor: pointer; text-transform: uppercase; letter-spacing: 0.04em;
}

/* Skeleton shimmer */
.skeleton {
  background: linear-gradient(90deg, var(--bg-surface-tertiary) 25%, var(--bg-surface-secondary) 50%, var(--bg-surface-tertiary) 75%);
  background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 4px;
}
@keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
.skeleton-text { height: 14px; margin-bottom: 8px; width: 60%; }
.skeleton-text.short { width: 40%; }
.skeleton-kpi { height: 36px; margin-bottom: 6px; width: 55%; }
.skeleton-card { height: 160px; border-radius: var(--radius-container); }

/* Offline banner */
#offline-banner {
  display: none; background: color-mix(in srgb, var(--status-negative) 10%, transparent);
  border: 1px solid var(--status-negative);
  border-radius: var(--radius-container); padding: 12px 16px; margin-bottom: 14px;
  color: var(--status-negative); font-size: 13px; font-weight: 500;
  text-align: center;
}
#offline-banner .offline-action {
  display: inline-block; margin-left: 8px; font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  font-size: 11px; font-weight: 600; color: var(--status-negative);
  cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
}

/* Toast */
#toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
  background: var(--bg-surface-tertiary); border: 1px solid var(--border-default);
  border-radius: var(--radius-element); padding: 12px 24px;
  font-size: 13px; color: var(--text-content-primary);
  opacity: 0; transition: all .25s ease; pointer-events: none; z-index: 100;
}
#toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.success { border-color: var(--status-positive); color: var(--status-positive); }
#toast.error   { border-color: var(--status-negative); color: var(--status-negative); }

/* ===================================================================
   RESPONSIVE
   =================================================================== */
@media (max-width: 768px) {
  body { padding: 8px; }
  #status-bar { flex-wrap: wrap; gap: 10px; font-size: 11px; padding: 10px 14px; }
  #status-bar .status-left, #status-bar .status-right { gap: 10px; }
  main { grid-template-columns: 1fr; gap: 12px; }
  .kpi-row { grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .kpi-card { padding: 10px 12px; }
  .kpi-card .kpi-label { font-size: 9px; }
  .kpi-card .kpi-value { font-size: 24px; }
  .kpi-card .kpi-sub { font-size: 9px; }
  .grid { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(3, 1fr); gap: 8px; }
  .product-card { flex-direction: column; align-items: stretch; gap: 10px; padding: 12px; min-height: auto; }
  .product-icon { width: 100%; max-width: none; aspect-ratio: auto; height: 80px; border-radius: 8px; }
  .product-icon svg { width: 32px; height: 32px; }
  .product-card .text-panel { padding: 0; text-align: center; }
  .product-card .product-name { font-size: 13px; }
  .product-card .armed-qty { font-size: 28px; }
  .product-card .slot-num { font-size: 9px; }
  #right-panel { gap: 10px; }
  #right-panel section { padding: 12px 14px; }
  .btn { min-height: 44px; }
  .btn-lg { padding: 14px 20px; font-size: 14px; }

  #sale-strip { flex-wrap: wrap; }
  #sale-strip #staged-items { flex: 1 1 100%; gap: 6px; }

  /* Fix: staged product cards used flex-wrap with min/max width,
     causing uneven 2-2-1 wrapping on phone. Force a real 3-column
     grid so it's always 3 per row, wrapping cleanly to next row. */
  #sale-strip #staged-items {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px;
  }
  #sale-strip .staged-card { min-width: 0; max-width: none; width: 100%; }
  .sale-controls {
    flex-wrap: wrap; width: 100%; flex: 1 1 100%;
    gap: 8px; justify-content: flex-start;
  }
  .qty-stepper { order: 1; }
  #btn-stage { order: 2; flex: 1 1 auto; }
  #btn-clear-sale { order: 3; flex: 1 1 auto; }
  #btn-arm { order: 4; flex: 1 1 90px; }
  .sale-total { order: 5; flex: 0 0 auto; margin-left: auto; align-self: center; }
}

@media (max-width: 480px) {
  .kpi-row { grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .kpi-card .kpi-value { font-size: 22px; }
  .grid { grid-template-rows: repeat(3, 1fr); }
  .product-card { flex-direction: column; align-items: stretch; gap: 8px; padding: 10px; min-height: auto; }
  .product-icon { width: 100%; max-width: none; aspect-ratio: auto; height: 64px; border-radius: 8px; }
  .product-icon svg { width: 28px; height: 28px; }
  .product-card .text-panel { padding: 0; text-align: center; }
  .product-card .product-name { font-size: 12px; }
  .product-card .armed-qty { font-size: 24px; }
  .product-card .status-row { font-size: 10px; gap: 6px; }
  .sale-total { font-size: 18px; }
  .staged-row .staged-qty { font-size: 13px; }
  .btn { font-size: 12px; padding: 10px 14px; }
  .section-label { font-size: 10px; }
  #status-bar { font-size: 10px; }
  .qty-stepper input { font-size: 16px; }
  .toast { font-size: 12px; padding: 10px 16px; }
}

/* ---------------------------------------------------------------------------
   Touch behaviour (iPad / iOS Safari)

   iOS Safari 10+ deliberately ignores `user-scalable=no` in the viewport tag
   for accessibility, so double-tap-to-zoom stays enabled no matter what the
   <head> says. `touch-action: manipulation` is what actually removes the
   double-tap gesture -- and it leaves PINCH-zoom working, so the page can
   still be magnified deliberately.

   It has to be set on every element that can be tapped: touch-action is not
   inherited, and .btn was the only rule carrying it, which is why the stepper
   +/- and the product cards still zoomed.
   --------------------------------------------------------------------------- */
html, body { touch-action: manipulation; }

button, input, select, textarea, a,
.btn, .stepper-btn, .qty-stepper,
.product-card, .kpi-card, .staged-card, .staged-card-remove,
.list-row, .tab, .chip {
  touch-action: manipulation;
}

/* Double-tapping text selects it and flashes a highlight before the zoom is
   suppressed. Controls are not meant to be selectable. */
button, .btn, .stepper-btn, .product-card, .kpi-card, .staged-card, .tab {
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}


/* Hover styles latch on iOS: a tapped control keeps its hover appearance
   until you tap somewhere else, so buttons read as stuck-selected after
   every sale. Confining them to pointer devices means touch simply never
   applies them -- no sticking, and no half-styled control either. */
@media (hover: hover) {
  #theme-toggle:hover { border-color: var(--border-strong); color: var(--accent-action); }
  .staged-card .staged-card-remove:hover { color: var(--status-negative); }
  .qty-stepper .stepper-btn:hover { background: var(--accent-action); color: #fff; }
  #sale-strip .btn-outline:hover { border-color: var(--accent-action); color: var(--accent-action); }
  .product-card:hover { border-color: var(--border-strong); transform: translateY(-1px); }
  .btn-remove:hover { border-color: var(--status-negative); color: var(--status-negative); }
  .btn-primary:hover { background: var(--accent-action-hover); }
  .btn-outline:hover { border-color: var(--border-strong); color: var(--accent-action); }
  .btn-sm:hover { border-color: var(--border-strong); color: var(--accent-action); }
  .btn-sm.retry:hover { background: var(--accent-action); color: #fff; }
  .btn-sm.dismiss:hover { border-color: var(--status-negative); color: var(--status-negative); }
  .btn-negative:hover { background: var(--status-negative); color: #fff; }
}

</style>
</head>
<body>

<div id="viewport" style="flex:1;display:flex;flex-direction:column;min-height:0;overflow:auto;">
<header id="status-bar">
  <div class="status-left">
    <span id="machine-status"><span class="dot dot-neutral"></span> Connecting</span>
    <span>Machine 001</span>
  </div>
  <div class="status-center">
    <span id="pause-indicator" class="hidden" style="color:var(--status-caution);font-weight:600;">PAUSED</span>
  </div>
  <div class="status-right">
    <button id="theme-toggle">LIGHT</button>
    <span id="last-update">--:--:--</span>
  </div>
</header>

<div id="offline-banner">
  Machine unreachable. <span id="offline-retry" class="offline-action">Retry connection</span>
</div>

<!-- KPI Row -->
<div class="kpi-row" id="kpi-row">
  <div class="kpi-card"><div class="kpi-label">Total Armed</div><div class="kpi-value" id="kpi-armed">0</div><div class="kpi-sub">units across all slots</div></div>
  <div class="kpi-card"><div class="kpi-label">In Stock</div><div class="kpi-value" id="kpi-active" style="color:var(--status-positive);">6</div><div class="kpi-sub" id="kpi-active-sub">of 6 active slots</div></div>
  <div class="kpi-card"><div class="kpi-label">Phase</div><div class="kpi-value" id="kpi-bundle">IDLE</div><div class="kpi-sub" id="kpi-bundle-sub">waiting for sale</div></div>
  <div class="kpi-card"><div class="kpi-label">Today</div><div class="kpi-value" id="kpi-today">0</div><div class="kpi-sub">dispenses completed</div></div>
</div>

<!-- Sale Strip (horizontal, full width) -->
<div id="sale-strip">
  <div id="staged-items"><span class="muted">Select product, then set quantity</span></div>
  <div class="sale-controls">
    <div class="qty-stepper" id="qty-stepper">
      <button class="stepper-btn" id="stepper-down">−</button>
      <input type="text" id="qty-value" value="1" inputmode="numeric" pattern="[0-9]*" readonly>
      <button class="stepper-btn" id="stepper-up">+</button>
    </div>
    <button id="btn-stage" class="btn btn-outline" disabled>Stage</button>
    <button id="btn-clear-sale" class="btn btn-outline">Clear</button>
    <button id="btn-arm" class="btn btn-primary" disabled>Arm</button>
    <div id="sale-total" class="sale-total">0 presses</div>
  </div>
</div>

<main>
  <section style="min-width:0;">
    <div class="grid" id="grid-container"></div>
    <button id="btn-select-all" class="btn btn-primary" style="margin-top:10px;width:100%;padding:12px;font-size:14px;">Select All Products</button>
  </section>

  <aside id="right-panel">
    <section id="armed-section" class="status-section" style="display:none;">
      <div class="section-label">Armed <span id="armed-count">0</span></div>
      <div id="armed-list"></div>
      <button id="btn-cancel-all" class="btn btn-negative btn-block" style="margin-top:4px;">Clear All Credits</button>
    </section>
    <section id="dispensing-section" class="status-section" style="display:none;">
      <div class="section-label">Dispensing <span id="queue-count">0</span></div>
      <div id="queue-list"></div>
    </section>
    <section id="attention-section" class="status-section" style="display:none;">
      <div class="section-label">Attention</div>
      <div id="unclaimed-list"></div>
    </section>
    <section id="alerts-section" class="status-section" style="display:none;">
      <div class="section-label">Alerts</div>
      <div id="alert-list"></div>
    </section>
  </aside>
</main>

<div id="toast"></div>

</div>

<script>
(function() {
  'use strict';

  const PRODUCT = {
    1: 'Detergent 1', 2: 'Detergent 2', 3: 'Fabcon 1',
    4: 'Fabcon 2', 5: 'Zonrox 1', 6: 'Zonrox 2',
  };
  const PRODUCT_INITIAL = { 1:'D1', 2:'D2', 3:'F1', 4:'F2', 5:'Z1', 6:'Z2' };
  const PRODUCT_ML = { 1: 75, 2: 75, 3: 60, 4: 60, 5: 100, 6: 100 };
  const PRODUCT_ICON = {
    1: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c4.2 4.6 6.5 8.1 6.5 11a6.5 6.5 0 0 1-13 0c0-2.9 2.3-6.4 6.5-11z"/></svg>',
    2: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c4.2 4.6 6.5 8.1 6.5 11a6.5 6.5 0 0 1-13 0c0-2.9 2.3-6.4 6.5-11z"/></svg>',
    3: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8l1 3-2 1v9a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2V8L7 7l1-3z"/><path d="M10 4V2.5M14 4V2.5"/></svg>',
    4: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8l1 3-2 1v9a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2V8L7 7l1-3z"/><path d="M10 4V2.5M14 4V2.5"/></svg>',
    5: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h4v3l2 2v10a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V8l2-2V3z"/><path d="M15 9h1.5a1.5 1.5 0 0 1 1.5 1.5V15a1.5 1.5 0 0 1-1.5 1.5H15"/></svg>',
    6: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h4v3l2 2v10a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V8l2-2V3z"/><path d="M15 9h1.5a1.5 1.5 0 0 1 1.5 1.5V15a1.5 1.5 0 0 1-1.5 1.5H15"/></svg>',
  };
  // ACTIVE must match TOTAL_SLOTS in coin_slot/includes/hardware_config.h.
  const ACTIVE = 6, TOTAL = 6;
  const MAX_QTY = 10;
  // STATUS field count: "STATUS" + 5 arrays of ACTIVE + paused/phase/bundle.
  const STATUS_FIELDS = 5 * ACTIVE + 4;

  const S = {
    armedQty: new Array(TOTAL + 1).fill(0), remaining: new Array(TOTAL + 1).fill(0),
    wlvl: new Array(TOTAL + 1).fill(false), busy: new Array(TOTAL + 1).fill(false),
    queueDepth: new Array(TOTAL + 1).fill(0), paused: false,
    phase: 0, bundleComplete: false,
    lastUpdate: null, connected: false,
  };
  let selProduct = null, multiSelect = false, staged = [], unclaimed = [], saleCtr = 0, dispenseCount = 0, currentQty = 1;
  let prevArmed = new Array(TOTAL + 1).fill(0);
  let prevBusy  = new Array(TOTAL + 1).fill(false);
  let prevArmedQty = new Array(TOTAL + 1).fill(0); // pulse-on-arm detection
  const $ = (id) => document.getElementById(id);

  // Toast
  let toastTmr;
  function toast(msg, type) {
    const el = $('toast'); el.textContent = msg;
    el.className = 'visible' + (type ? ' ' + type : '');
    clearTimeout(toastTmr); toastTmr = setTimeout(() => el.className = '', 2600);
  }

  // SSE
  function connectSSE() {
    const es = new EventSource('/api/status/stream');
    es.addEventListener('message', (e) => {
      if (e.data === 'connected') {
        // Fresh connection — reset all state
        S.connected = true;
        S.armedQty.fill(0); S.remaining.fill(0); S.wlvl.fill(false);
        S.busy.fill(false); S.queueDepth.fill(0); S.paused = false;
        S.phase = 0; S.bundleComplete = false;
        dispenseCount = 0; staged = []; selProduct = null; unclaimed = [];
        renderStaged(); updateArm();
        $('btn-stage').disabled = true; currentQty = 1; $('qty-value').value = 1;
        refresh(); return;
      }
      if (e.data.startsWith('UNCLAIMED:')) { addUnclaimed(e.data); return; }
      parse(e.data);
    });
    es.addEventListener('error', () => { S.connected = false; refresh(); });
  }

  function parse(raw) {
    const p = raw.split(','); if (p.length < STATUS_FIELDS) return;
    let i = 1;
    for (let s = 1; s <= ACTIVE; s++) S.armedQty[s]   = parseInt(p[i++]) || 0;
    for (let s = 1; s <= ACTIVE; s++) S.remaining[s]  = parseInt(p[i++]) || 0;
    for (let s = 1; s <= ACTIVE; s++) S.wlvl[s]       = p[i++] === '1';
    for (let s = 1; s <= ACTIVE; s++) S.busy[s]       = p[i++] === '1';
    for (let s = 1; s <= ACTIVE; s++) S.queueDepth[s] = parseInt(p[i++]) || 0;
    S.paused = p[i++] === '1';
    S.phase = parseInt(p[i++]) || 0;     // 0=IDLE, 1=ARMED, 2=DISPENSING, 3=COMPLETE
    S.bundleComplete = p[i] === '1';

    // Count actual dispenses: busy false→true = button was pressed
    for (let s = 1; s <= ACTIVE; s++) {
      if (S.busy[s] && !prevBusy[s]) dispenseCount++;
      prevBusy[s] = S.busy[s];
    }
    S.lastUpdate = new Date(); refresh();
  }

  function addUnclaimed(raw) {
    const p = raw.substring(10).split(',');
    if (p.length >= 3) {
      unclaimed.push({ slot: +p[0], qty: +p[1], time: p[2] || '' });
      renderUnclaimed();
    }
  }

  // KPIs
  function refresh() {
    updateStatus();
    updateKPIs();
    renderGrid();
    renderArmed();
    renderQueue();
    renderAlerts();
    renderUnclaimed();
  }

  function updateStatus() {
    if (S.connected) {
      $('machine-status').innerHTML = '<span class="dot dot-positive"></span> Online';
      $('offline-banner').style.display = 'none';
    } else {
      $('machine-status').innerHTML = '<span class="dot dot-negative"></span> Offline';
      $('offline-banner').style.display = 'block';
    }
    $('pause-indicator').classList.toggle('hidden', !S.paused);
    if (S.lastUpdate) $('last-update').textContent = S.lastUpdate.toLocaleTimeString('en-US', { hour12: false });
  }

  function updateKPIs() {
    let armed = 0, inStock = 0;
    for (let s = 1; s <= ACTIVE; s++) { armed += S.armedQty[s]; if (!S.wlvl[s]) inStock++; }
    $('kpi-armed').textContent = armed;
    $('kpi-active').textContent = inStock;
    $('kpi-active-sub').textContent = 'of ' + ACTIVE + ' active slots';
    $('kpi-active').style.color = inStock === ACTIVE ? 'var(--status-positive)'
      : (inStock >= Math.ceil(ACTIVE / 2) ? 'var(--status-caution)' : 'var(--status-negative)');
    // Phase indicator
    const phases = ['IDLE','ARMED','DISPENSING','COMPLETE'];
    $('kpi-bundle').textContent = phases[S.phase] || 'IDLE';
    $('kpi-bundle').style.color = S.bundleComplete ? 'var(--status-positive)' : (S.phase === 3 ? 'var(--accent-action)' : 'var(--text-content-primary)');
    $('kpi-bundle-sub').textContent = S.bundleComplete ? 'bundle complete!' : (S.phase === 0 ? 'waiting for sale' : (S.phase === 1 ? 'buttons live' : 'dispensing...'));
    $('kpi-today').textContent = dispenseCount;
  }

  // Grid
  function renderGrid() {
    let h = '';
    for (let s = 1; s <= TOTAL; s++) {
      const act = s <= ACTIVE, armed = S.armedQty[s] || 0, busy = S.busy[s],
            empty = S.wlvl[s], sel = multiSelect ? (!empty && act) : (selProduct === s);
      let cls = 'product-card';
      if (!act) cls += ' inactive'; else if (busy) cls += ' busy';
      else if (empty) cls += ' empty'; else if (armed > 0 && !sel) cls += ' armed';
      if (sel) cls += ' selected';

      let dotHtml, dotColor;
      if (!act)      { dotHtml = '<span class="dot dot-neutral"></span> N/A';      dotColor = 'var(--text-content-secondary)'; }
      else if (busy) { dotHtml = '<span class="dot dot-caution"></span> Busy';     dotColor = 'var(--status-caution)'; }
      else if (empty){ dotHtml = '<span class="dot dot-negative"></span> Empty';   dotColor = 'var(--status-negative)'; }
      else if (sel)  { dotHtml = '<span class="dot dot-accent"></span> Selected';  dotColor = 'var(--accent-action)'; }
      else if (armed){ dotHtml = '<span class="dot dot-positive"></span> Armed';   dotColor = 'var(--status-positive)'; }
      else           { dotHtml = '<span class="dot dot-neutral"></span> Idle';     dotColor = 'var(--text-content-secondary)'; }

      const justArmed = act && !prevArmedQty[s] && armed > 0;
      prevArmedQty[s] = armed;
      const qCls = !act || armed === 0 ? 'is-zero' : (busy ? 'is-busy' : (sel ? 'is-selected' : 'is-armed'));
      const pulseCls = justArmed ? ' pulse-arm' : '';

      h += '<div class="'+cls+'" data-slot="'+s+'" data-product="'+s+'">';
      h += '<div class="product-icon">'+PRODUCT_ICON[s]+'</div>';
      h += '<div class="text-panel">';
      h += '<div class="slot-num">SLOT '+String(s).padStart(2,'0')+'</div>';
      h += '<div class="product-name">'+PRODUCT[s]+'</div>';
      h += '<div class="armed-qty '+qCls+pulseCls+'">'+(act ? armed : '--')+'</div>';
      h += '<div class="status-row" style="color:'+dotColor+'">'+dotHtml+'</div>';
      h += '</div></div>';
    }
    $('grid-container').innerHTML = h;
    $('grid-container').querySelectorAll('.product-card').forEach(c => {
      c.addEventListener('click', () => {
        const s = +c.dataset.slot;
        if (s <= ACTIVE && !S.wlvl[s]) selectProduct(s);
      });
    });
  }

  // Right panel
  function renderArmed() {
    let h = '', cnt = 0;
    for (let s = 1; s <= ACTIVE; s++) {
      if (S.armedQty[s] > 0 || S.busy[s]) {
        cnt += S.armedQty[s];
        const dot = S.busy[s] ? '<span class="dot dot-caution"></span>' : '<span class="dot dot-positive"></span>';
        h += '<div class="list-row">'+dot+'<span class="list-name">'+PRODUCT[s]+'</span>';
        h += '<span class="list-val">'+S.armedQty[s]+'</span>';
        h += '<button class="btn-negative" data-slot="'+s+'">Cancel</button></div>';
      }
    }
    $('armed-count').textContent = cnt;
    $('armed-list').innerHTML = h || '<span class="muted">--</span>';
    $('btn-cancel-all').style.display = h ? 'block' : 'none';
    $('armed-section').style.display = h ? 'block' : 'none';
    $('armed-list').querySelectorAll('.btn-negative').forEach(b => {
      b.addEventListener('click', () => cancelSlot(+b.dataset.slot));
    });
  }

  function renderQueue() {
    let h = '', cnt = 0;
    for (let s = 1; s <= ACTIVE; s++) {
      if (S.busy[s]) {
        cnt++;
        let pct = S.remaining[s] > 0 ? Math.round(100 - (S.remaining[s] / 2500) * 100) : 100;
        h += '<div class="list-row"><span style="font-weight:600;">'+PRODUCT[s]+'</span><span class="list-val">'+pct+'%</span></div>';
      }
    }
    $('queue-count').textContent = cnt;
    $('queue-list').innerHTML = h || '<span class="muted">--</span>';
    $('dispensing-section').style.display = h ? 'block' : 'none';
  }

  function renderAlerts() {
    let issues = '';
    for (let s = 1; s <= ACTIVE; s++) {
      if (S.wlvl[s]) issues += '<div class="list-row" style="color:var(--status-negative);"><span><span class="dot dot-negative"></span> SLOT '+String(s).padStart(2,'0')+': '+PRODUCT[s]+'</span><span>[EMPTY]</span></div>';
    }
    if (!S.connected) issues += '<div class="list-row" style="color:var(--status-negative);"><span><span class="dot dot-negative"></span> Machine offline</span><span>[OFFLINE]</span></div>';
    if (issues) {
      let issueCount = (issues.match(/list-row/g) || []).length;
      $('alert-list').innerHTML = '<div class="alert-card"><div class="alert-heading">'+issueCount+' issue(s) detected</div>'+issues+'</div>';
      $('alerts-section').style.display = 'block';
    } else {
      $('alert-list').innerHTML = '<span class="muted">--</span>';
      $('alerts-section').style.display = 'none';
    }
  }

  function renderUnclaimed() {
    if (!unclaimed.length) { $('unclaimed-list').innerHTML = '<span class="muted">--</span>'; $('attention-section').style.display = 'none'; return; }
    let h = '';
    unclaimed.forEach((it, idx) => {
      h += '<div class="list-row" style="color:var(--status-caution);">';
      h += '<span><span class="dot dot-caution"></span> SLOT '+String(it.slot).padStart(2,'0')+': '+it.qty+' presses'+'</span>';
      h += '<span style="display:flex;gap:4px;">';
      h += '<button class="btn-sm retry" data-idx="'+idx+'" data-act="retry">Retry</button>';
      h += '<button class="btn-sm dismiss" data-idx="'+idx+'" data-act="dismiss">Dismiss</button>';
      h += '</span></div>';
    });
    $('unclaimed-list').innerHTML = h;
    $('attention-section').style.display = 'block';
    $('unclaimed-list').querySelectorAll('[data-idx]').forEach(b => {
      b.addEventListener('click', () => resolveUnclaimed(+b.dataset.idx, b.dataset.act));
    });
  }

  // Sale
  function selectProduct(id) { multiSelect = false; selProduct = id; renderGrid(); $('btn-stage').disabled = false; }
  function enableQtyStepper() { $('btn-stage').disabled = false; }
  function stageItem(id, qtyOverride) {
    const qty = qtyOverride != null ? qtyOverride : currentQty;
    const ml = qty * (PRODUCT_ML[id] || 0);
    // Merge: if product already staged, add to existing qty
    const existing = staged.find(it => it.id === id);
    if (existing) { existing.qty += qty; existing.ml += ml; }
    else { staged.push({ id, name: PRODUCT[id], qty, ml }); }
    selProduct = null; $('btn-stage').disabled = true; currentQty = 1; $('qty-value').value = 1;
    renderStaged(); renderGrid(); updateArm();
  }
  function removeStaged(i) { staged.splice(i,1); renderStaged(); updateArm(); }
  function renderStaged() {
    if (!staged.length) { $('staged-items').innerHTML = '<span class="muted">Select product, then set quantity</span>'; $('sale-total').textContent = '0 presses'; return; }
    let h = '', totalQty = 0;
    staged.forEach((it, i) => {
      totalQty += it.qty;
      h += '<div class="staged-card"><button class="staged-card-remove" data-idx="'+i+'">&times;</button><span class="staged-card-name">'+it.name+'</span><span class="staged-card-qty">'+it.qty+'\xD7 \xB7 '+it.ml+'ml</span></div>';
    });
    $('staged-items').innerHTML = h; $('sale-total').textContent = totalQty + ' press' + (totalQty !== 1 ? 'es' : '');
    $('staged-items').querySelectorAll('.staged-card-remove').forEach(b => b.addEventListener('click', () => removeStaged(+b.dataset.idx)));
  }
  function updateArm() {
    $('btn-arm').disabled = !staged.length;
    $('btn-arm').textContent = staged.length ? 'Arm '+staged.length+' Slot'+(staged.length>1?'s':'') : 'Arm';
  }

  // API
  async function executeArm() {
    if (!staged.length) return;
    $('btn-arm').disabled = true; $('btn-arm').textContent = 'Working...';
    const sid = 'SALE-'+Date.now()+'-'+(++saleCtr);
    // Build ARM_BATCH payload: slot:qty,slot:qty,...
    const batch = staged.map(i => i.id+':'+i.qty).join(',');
    try {
      const r = await fetch('/api/arm', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ saleId:sid, batch }) });
      const d = await r.json();
      if (d.success) {
        toast('Armed: '+staged.map(i=>i.name+' ('+i.qty+'x)').join(', '), 'success');
        staged = []; selProduct = null; $('btn-stage').disabled = true; currentQty = 1; $('qty-value').value = 1;
        renderStaged(); renderGrid(); updateArm();
      } else {
        toast('Arm failed: '+ (d.error || 'unknown'), 'error');
      }
    } catch(e) { toast('Error: '+e.message, 'error'); }
    finally { updateArm(); }
  }
  async function cancelSlot(id) {
    try {
      await fetch('/api/cancel', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({productId:id}) });
      toast('Slot ' + id + ' cancelled', 'info');
    } catch(e) { /* silent */ }
  }

  async function cancelAll() {
    try {
      await fetch('/api/cancel-all', { method:'POST', headers:{'Content-Type':'application/json'} });
      toast('All slots cancelled', 'info');
    } catch(e) { /* silent */ }
  }

  async function cancelQueueSlot(id) {
    try {
      await fetch('/api/cancel-queue', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({productId:id}) });
    } catch(e) { /* silent */ }
  }
  async function resolveUnclaimed(idx, action) {
    const it = unclaimed[idx];
    try {
      await fetch('/api/unclaimed/resolve', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({slot:it.slot,qty:it.qty,action}) });
      unclaimed.splice(idx,1); renderUnclaimed();
    } catch(e) { /* silent */ }
  }

  // Theme
  const html = document.documentElement;
  const saved = localStorage.getItem('sabon-theme');
  if (saved) html.setAttribute('data-theme', saved);
  $('theme-toggle').textContent = html.getAttribute('data-theme') === 'dark' ? 'LIGHT' : 'DARK';
  $('theme-toggle').addEventListener('click', () => {
    const nxt = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', nxt);
    localStorage.setItem('sabon-theme', nxt);
    $('theme-toggle').textContent = nxt === 'dark' ? 'LIGHT' : 'DARK';
  });

  // Offline retry
  $('offline-retry').addEventListener('click', () => { connectSSE(); });

  // Sale events
  // Stepper buttons
  $('stepper-up').addEventListener('click', () => {
    currentQty = Math.min(currentQty + 1, MAX_QTY);
    $('qty-value').value = currentQty;
  });
  $('stepper-down').addEventListener('click', () => {
    currentQty = Math.max(currentQty - 1, 1);
    $('qty-value').value = currentQty;
  });

  // Stage button
  $('btn-stage').addEventListener('click', () => {
    if (multiSelect) {
      const qty = currentQty;
      for (let s = 1; s <= ACTIVE; s++) { if (!S.wlvl[s]) stageItem(s, qty); }
      multiSelect = false; renderGrid();
    } else if (selProduct !== null) {
      stageItem(selProduct);
    }
  });

  // Select All
  $('btn-select-all').addEventListener('click', () => {
    multiSelect = true; selProduct = null;
    renderGrid();
    enableQtyStepper();
  });

  // Clear
  $('btn-clear-sale').addEventListener('click', () => {
    staged = []; selProduct = null; multiSelect = false;
    $('btn-stage').disabled = true; currentQty = 1; $('qty-value').value = 1;
    renderStaged(); renderGrid(); updateArm();
  });

  // Arm
  $('btn-arm').addEventListener('click', executeArm);

  // Cancel all
  $('btn-cancel-all').addEventListener('click', cancelAll);

  // Init
  renderGrid();
  connectSSE();

  // Skeleton timeout: if no STATUS data after 4s, show demo
  setTimeout(() => {
    if (!S.lastUpdate) {
      S.armedQty[1] = 2; S.armedQty[2] = 1; S.busy[3] = true;
      S.wlvl[4] = true; S.queueDepth[2] = 1;
      S.armedQty[6] = 3; S.busy[6] = true;   // slot 6 live — no longer inactive
      S.lastUpdate = new Date(); refresh();
    }
  }, 4000);
})();</script>
</body>
</html>
